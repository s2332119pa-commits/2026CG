
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>割り勘計算ツール</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 480px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #284f79;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: #284f79;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3977ad;
        }

        #result {
            margin-top: 25px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>割り勘計算ツール</h1>

        <p>
            合計金額と人数を入力すると、
            1人あたりの支払い額を計算します。
        </p>

        <label for="total">合計金額（円）</label>
        <input type="number" id="total" min="0" step="1">

        <label for="people">人数（人）</label>
        <input type="number" id="people" min="1" step="1">

        <button type="button" onclick="calculate()">
            計算する
        </button>

        <div id="result" aria-live="polite"></div>
    </div>

    <script>
        function calculate() {

            // 入力された値を取得する
            const total = Number(
                document.getElementById("total").value
            );

            const people = Number(
                document.getElementById("people").value
            );

            // 結果を表示する場所
            const result = document.getElementById("result");

            // 入力チェック
            if (
                document.getElementById("total").value === "" ||
                document.getElementById("people").value === "" ||
                !Number.isInteger(total) ||
                !Number.isInteger(people) ||
                total < 0 ||
                people <= 0
            ) {
                result.textContent =
                    "正しい金額と人数を入力してください。";
                return;
            }

            // 1人あたりの支払い額
            const payment = Math.ceil(total / people);

            // 端数の切り上げによって余る金額
            const extra = payment * people - total;

            // 計算結果を表示する
            result.innerHTML =
                "1人あたり：" + payment.toLocaleString() + "円" +
                "<br>余剰金額：" + extra.toLocaleString() + "円";
        }
    </script>

</body>
</html>
